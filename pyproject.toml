[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdesk"
version = "0.1.0"
description = "A desktop AI-agent assistant with a mock LLM, tool-calling, permissions, and workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abdulmalek Azouz" }]
keywords = ["ai-agent", "desktop-gui", "pyside6", "tool-use", "automation"]

dependencies = [
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
agentdesk = "agentdesk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentdesk = ["gui/styles.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.pydocstyle]
convention = "google"
